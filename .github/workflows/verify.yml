# Runs the repo's single gate entrypoint (.claude/verify.sh) with no args. The checks live in
# verify.sh only; this workflow installs the tools it needs and calls it. Tool choices and pins:
# .claude/verify.md. Re-resolve SHAs from tags when bumping: gh api repos/<o>/<r>/git/ref/tags/<tag>.
name: verify

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install tools
        run: uv tool install shellcheck-py==0.11.0.1
      - name: Verify
        run: ./.claude/verify.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
